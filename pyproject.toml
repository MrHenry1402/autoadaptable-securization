[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "securization"
version = "0.1.0"
description = "Herramienta de deception autodesplegable y autoadaptable (U-Tad, Proyectos de Ciberseguridad)"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncssh>=2.17",
    "cryptography>=43",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "httpx>=0.27",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/securization"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "S",       # flake8-bandit
    "ASYNC",   # async correctness
    "SIM",     # simplify
    "C4",      # comprehensions
    "PTH",     # pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["securization"]
branch = true
